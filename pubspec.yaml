# アプリ名
name: flutter_application_1

# 説明
description: "A new Flutter project."

publish_to: 'none'

# アプリのバージョン
version: 1.0.0+1

# 環境設定
environment:
  sdk: ^3.11.1

dependencies:
  # Flutter本体の機能を使うためのパッケージ
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_datetime_picker_plus: ^2.2.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.16.0
  geocoding: ^4.0.0
  http: ^1.6.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  crypto: ^3.0.7
  image_picker: ^1.2.1
  alarm: ^5.2.1
  vibration: ^3.2.1
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.5+1

# 開発用ツール
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  geocoding_platform_interface: ^3.2.0

# 以下のセクションは，Flutterパッケージに特化した内容
flutter:
  # 【正しい位置】ここでコード自動生成を有効にします
  generate: true

  # 次の行は，Material Icons フォントがアプリケーションに確実に含まれるようにする
  uses-material-design: true

  # アプリケーションにアセットを追加
  assets:
    - assets/alarm.mp3

# Configuration for flutter_launcher_icons
flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/AndroidIcon.png"